name: AIVS encrypted authentication boundary check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_URL: ${{ secrets.PF_AUTH_URL }}
      CANDIDATE: ${{ secrets.PF_CANDIDATE }}
      RESULT_PUBKEY: ${{ secrets.RESULT_PUBKEY }}
    steps:
      - name: Record runner source and encrypt the status
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$TARGET_URL" && -n "$CANDIDATE" && -n "$RESULT_PUBKEY" ]]
          printf 'source_ipv4=%s\n' "$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)"
          printf 'utc=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '%s\n' "$RESULT_PUBKEY" > /tmp/aivs-result-public.pem
          status="$(curl -4s --connect-timeout 5 --max-time 12 \
            --request POST --data-binary '' --output /dev/null \
            --write-out '%{http_code}' --user-agent 'AIVS-authorized-boundary-check/2026-10-14' \
            --header "X-PF-Key: ${CANDIDATE}" "$TARGET_URL")" || status=ERR
          ciphertext="$(printf '%s' "$status" | openssl pkeyutl -encrypt -pubin \
            -inkey /tmp/aivs-result-public.pem | base64 -w0)"
          printf 'encrypted_result=%s\n' "$ciphertext"
